name: build + push docs image to GHCR

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BASE="${REGISTRY}/${IMAGE}"
          # Lowercase the repo name — GHCR rejects uppercase.
          BASE_LC="${BASE,,}"
          echo "primary=${BASE_LC}:sha-${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "moving=${BASE_LC}:develop"  >> "$GITHUB_OUTPUT"

      - name: Build + push (linux/amd64 only — VPS is x86)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.primary }}
            ${{ steps.tags.outputs.moving }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
